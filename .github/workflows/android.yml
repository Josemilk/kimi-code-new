name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/kimi-code-android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 10 SDK
        run: sdkmanager 'platforms;android-29' 'build-tools;35.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: apps/kimi-code-android
        run: gradle --no-daemon assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kimi-code-android-api29
          path: apps/kimi-code-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 15
